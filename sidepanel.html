<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码管家</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 解锁视图 -->
        <section id="unlock-view" class="view">
            <div class="logo-container">
                <span class="icon-shield">🔒</span>
                <h1 class="welcome-text">欢迎回来</h1>
            </div>
            <div class="input-group">
                <label>输入主密码</label>
                <input type="password" id="master-password" placeholder="••••••••">
                <div id="unlock-error" class="error-text hidden"></div>
            </div>
            <button id="unlock-btn" class="primary-btn">解锁保险库</button>
        </section>

        <!-- 主仪表盘视图 -->
        <section id="main-view" class="view hidden">
            <header>
                <span class="brand">密码管家</span>
                <div class="header-right">
                    <button id="nav-add-btn" class="icon-btn">＋</button>
                    <button id="nav-settings-btn" class="icon-btn">⚙️</button>
                </div>
            </header>
            
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="搜索密码...">
            </div>

            <div class="content-scroll">
                <div id="current-site-section" class="section">
                    <div class="section-header">
                        <span class="indicator active"></span>
                        <h2 id="current-site-title" class="section-title">当前网站</h2>
                    </div>
                    <div id="current-site-list" class="account-list"></div>
                </div>

                <div id="all-accounts-section" class="section">
                    <div class="section-header">
                        <span class="indicator"></span>
                        <h2 class="section-title">所有账号</h2>
                    </div>
                    <div id="all-accounts-list" class="account-list"></div>
                </div>
            </div>
        </section>

        <!-- 添加账号视图 -->
        <section id="add-view" class="view hidden">
            <header>
                <button id="add-back-btn" class="icon-btn">←</button>
                <span class="view-title">添加新账号</span>
                <button id="save-account-btn" class="save-btn">保存</button>
            </header>
            <div class="form-container">
                <div class="input-group">
                    <label>网站域名</label>
                    <input type="text" id="add-url" placeholder="example.com">
                </div>
                <div class="input-group">
                    <label>用户名 / 账号</label>
                    <input type="text" id="add-username" placeholder="你的账号">
                </div>
                <div class="input-group">
                    <label>登录密码</label>
                    <div class="input-wrapper">
                        <input type="password" id="add-password" placeholder="输入密码">
                        <button id="generate-pass-btn" class="dice-btn" title="随机生成">🎲</button>
                    </div>
                </div>
                <div id="add-error" class="error-text hidden" style="margin-top: -15px; margin-bottom: 15px;"></div>
                <div class="input-group">
                    <label>备注信息</label>
                    <textarea id="add-notes" placeholder="有什么想备注的吗？..."></textarea>
                </div>
            </div>
        </section>

        <!-- 设置视图 -->
        <section id="settings-view" class="view hidden">
            <header>
                <button id="settings-back-btn" class="icon-btn">←</button>
                <span class="view-title">设置中心</span>
                <div style="width: 36px;"></div>
            </header>
            <div class="settings-container">
                <div class="settings-group">
                    <div class="group-title">数据管理</div>
                    <button id="export-data-btn" class="settings-item">
                        <span class="item-icon">📤</span>
                        <span class="item-label">导出数据 (明文 JSON)</span>
                    </button>
                    <div class="settings-item" style="cursor: default; flex-direction: column; align-items: flex-start; gap: 8px;">
                        <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                            <span class="item-icon">📥</span>
                            <span class="item-label">导入数据</span>
                            <input type="file" id="import-data-file" style="display:none" accept=".json">
                            <button id="import-trigger-btn" class="mini-btn" style="margin-left: auto;">选择文件</button>
                        </div>
                        <div class="import-tip">
                            仅支持本插件导出的标准 .json 文件。<br>
                            <span id="copy-template-btn" style="color: var(--accent-color); cursor: pointer; text-decoration: underline;">复制 JSON 模板</span>
                        </div>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="group-title">安全选项</div>
                    <button id="lock-vault-btn" class="settings-item">
                        <span class="item-icon">🔒</span>
                        <span class="item-label">立即锁定保险库</span>
                    </button>
                    <button id="reset-vault-btn" class="settings-item danger">
                        <span class="item-icon">⚠️</span>
                        <span class="item-label">清除所有数据</span>
                    </button>
                </div>

                <div class="settings-footer">
                    <p>密码管家 v1.0.0</p>
                    <p>本地加密存储 · 隐私优先</p>
                </div>
            </div>
        </section>
    </div>
    <script src="crypto-utils.js"></script>
    <script src="sidepanel.js"></script>
</body>
</html>
